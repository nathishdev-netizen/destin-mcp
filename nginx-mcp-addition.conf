# Add this new server block to your existing nginx.conf
# This is ONLY for the MCP server - won't affect your colleagues' work

    # MCP Server - Dedicated HTTPS block
    server {
        listen 443 ssl http2;
        server_name mcp.your-domain.com;  # Replace with your actual subdomain
        
        # SSL configuration (you'll need to get certificates)
        ssl_certificate /etc/nginx/ssl/mcp-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/mcp-key.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers for MCP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CORS headers for Claude Desktop Pro
        add_header Access-Control-Allow-Origin "https://claude.ai" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://claude.ai";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Proxy to your MCP server container
            proxy_pass http://localhost:8003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for MCP
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check for MCP
        location /health {
            access_log off;
            proxy_pass http://localhost:8003/health;
        }
    }

    # HTTP to HTTPS redirect for MCP subdomain
    server {
        listen 80;
        server_name mcp.your-domain.com;  # Replace with your actual subdomain
        return 301 https://$server_name$request_uri;
    }
