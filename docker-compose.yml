services:
  destin-mcp-server:
    build: .
    container_name: destin-mcp-server
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=INFO
      - MCP_MODE=http
      - PORT=8000
    ports:
      - "8000:8000"  # If you add HTTP endpoints later
    volumes:
      - ./logs:/app/logs  # Persist logs
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('src'); from destin_mcp.server import DestinMCPServer; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge

volumes:
  logs:
    driver: local
